<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171416">
  <meta name="description" content="Dream Witness — dreamcore fashion and accessories for the space between waking and dreaming.">
  <title>Dream Witness — Fashion for the Unseen</title>
  <link rel="icon" type="image/x-icon" sizes="32x32" href="images/main/dream-witness-eye-favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header" id="top">
    <a class="brand-lockup" href="#top" aria-label="Dream Witness home">
      <img src="images/main/dream-witness-lockup-transparent.png" alt="Dream Witness">
    </a>
    <button class="menu-toggle" type="button" aria-label="Open navigation" aria-controls="primary-navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <nav class="primary-navigation" id="primary-navigation" aria-label="Main navigation">
      <a href="#shop" aria-label="Shop"><img src="images/main/shop.png" alt="Shop"></a>
      <a href="#new-arrivals" aria-label="New arrivals"><img src="images/main/dream-witness-label-new.png" alt="New arrivals"></a>
      <a href="#story" aria-label="Story"><img src="images/main/dream-witness-label-story-final.png" alt="Story"></a>
      <a href="#the-muse" aria-label="The Muse"><img src="images/main/dream-witness-label-the-muse.png" alt="The Muse"></a>
    </nav>
    <span class="bag-icon" role="img" aria-label="Shopping is currently inactive">
      <img src="images/main/dream-witness-shopping-bag-transparent.png" alt="">
    </span>
  </header>

  <main id="main-content">
    <section class="hero" aria-label="Dream Witness collection">
      <div class="hero-slides" aria-live="off">
        <figure class="hero-slide is-active" data-slide="0">
          <img src="images/main/main1-wall-eyes.gif" alt="Dream Witness model in a black lace dress before a wall of watchful eyes" loading="eager" fetchpriority="high">
        </figure>
        <figure class="hero-slide" data-slide="1" aria-hidden="true">
          <video class="hero-banner-video" muted loop playsinline preload="auto" aria-hidden="true" tabindex="-1">
            <source src="images/main/fox-tail-original-background.mp4" type="video/mp4">
          </video>
        </figure>
        <figure class="hero-slide" data-slide="2" aria-hidden="true">
          <img src="images/main/main3.png" alt="Model and her reflection in an antique mirror" loading="lazy">
        </figure>
      </div>
      <div class="hero-shade" aria-hidden="true"></div>
      <div class="mirror-tear-reveal" aria-hidden="true">
        <img class="mirror-tear-frame" src="images/main/main3-tear-frame.png" alt="" loading="lazy">
      </div>
      <div class="hero-copy">
        <img class="hero-title" src="images/main/hero-copy-dress-for-the-unseen.png" alt="Dress for the unseen">
        <img class="hero-subtitle" src="images/main/hero-subtitle-dark-dreamcore.png" alt="Dark dreamcore for the hours between sleep and waking">
        <a class="hero-cta" href="#new-arrivals" aria-label="Explore the collection">
          <img src="images/main/hero-cta-shop-the-collection.png" alt="Shop the collection">
        </a>
      </div>
      <div class="hero-pagination" role="group" aria-label="Choose a banner">
        <button class="hero-dot is-active" type="button" data-go-to="0" aria-label="Show banner 1" aria-current="true"></button>
        <button class="hero-dot" type="button" data-go-to="1" aria-label="Show banner 2" aria-current="false"></button>
        <button class="hero-dot" type="button" data-go-to="2" aria-label="Show banner 3" aria-current="false"></button>
      </div>
      <p class="slide-status visually-hidden" role="status" aria-live="polite"></p>
    </section>

    <section class="category-section section-shell" id="shop" aria-label="Shop by category">
      <div class="section-heading category-heading">
        <img class="category-heading-title" src="images/main/shop-by-category.png" alt="Shop by category">
        <img class="category-heading-note" src="images/main/clothing-accessories-and.png" alt="Clothing, accessories, and more">
      </div>
      <div class="category-grid">
        <a class="category-card" href="tops.html" aria-label="Tops">
          <img class="category-photo" src="images/main/tops-category-card.png" alt="Dream Witness tops collection" loading="lazy">
          <img class="category-label" src="images/main/tops-category-label.png" alt="Tops" loading="lazy">
        </a>
        <a class="category-card" href="#new-arrivals" aria-label="Outerwear">
          <img class="category-photo" src="images/main/outerwear-category-card.png" alt="Dream Witness outerwear collection" loading="lazy">
          <img class="category-label" src="images/main/outerwear-category-label.png" alt="Outerwear" loading="lazy">
        </a>
        <a class="category-card" href="#new-arrivals" aria-label="Bottoms">
          <img class="category-photo" src="images/main/bottoms-category.png" alt="Dream Witness bottoms collection" loading="lazy">
          <img class="category-label" src="images/main/bottoms.png" alt="Bottoms" loading="lazy">
        </a>
        <a class="category-card" href="#new-arrivals" aria-label="Accessories">
          <img class="category-photo" src="images/main/accessories-category.png" alt="Dream Witness accessories collection" loading="lazy">
          <img class="category-label" src="images/main/accessories-category-label.png" alt="Accessories" loading="lazy">
        </a>
      </div>
    </section>

    <section class="brand-story" id="story" aria-label="The Dream Witness story">
      <img class="brand-story-photo" src="images/main/main4.png" alt="Dream Witness muse in a dark editorial portrait" loading="lazy">
      <div class="brand-story-shade" aria-hidden="true"></div>
      <div class="brand-story-copy">
        <img class="brand-story-eyebrow" src="images/main/brand-section-the-brand.png" alt="The brand" loading="lazy">
        <img class="brand-story-description" src="images/main/brand-section.png" alt="Clothes for the space between waking and dreaming. Layered silhouettes, strange details, and a quiet act of rebellion." loading="lazy">
      </div>
      <img class="brand-story-statement" src="images/main/brand-section-fashion.png" alt="Fashion for dreamers" loading="lazy">
    </section>

    <section class="arrivals-section section-shell" id="new-arrivals" aria-label="New arrivals">
      <div class="section-heading arrivals-heading">
        <img src="images/main/new-arrivals.png" alt="New arrivals" loading="lazy">
      </div>
      <div class="product-grid">
        <article class="product-card">
          <div class="product-image-wrap">
            <img class="product-image" src="images/main/tops-new-arrival-afterimage-cami.png" alt="Model wearing the Afterimage Cami" loading="lazy">
            <button class="wishlist-mark" type="button" data-product-id="afterimage-cami" data-product-name="Afterimage Cami" aria-label="Add Afterimage Cami to wishlist" aria-pressed="false">
              <img class="wishlist-outline" src="images/main/wishlist-heart-outline.png" alt="">
              <svg class="wishlist-filled" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
            </button>
          </div>
          <img class="product-label" src="images/main/label-afterimage-cami.png" alt="Afterimage Cami, 76 dollars" loading="lazy">
        </article>
        <article class="product-card">
          <div class="product-image-wrap">
            <img class="product-image" src="images/main/outerwear-new-arrival-hooded-cape-coat-talisman-handfix.png" alt="Model wearing the Veilkeeper Cape Coat" loading="lazy">
            <button class="wishlist-mark" type="button" data-product-id="veilkeeper-cape-coat" data-product-name="Veilkeeper Cape Coat" aria-label="Add Veilkeeper Cape Coat to wishlist" aria-pressed="false">
              <img class="wishlist-outline" src="images/main/wishlist-heart-outline.png" alt="">
              <svg class="wishlist-filled" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
            </button>
          </div>
          <img class="product-label" src="images/main/label-veilkeeper-cape-coat.png" alt="Veilkeeper Cape Coat, 198 dollars" loading="lazy">
        </article>
        <article class="product-card">
          <div class="product-image-wrap">
            <img class="product-image" src="images/main/bottoms-category-model-mini-skirt-alt-scene.png" alt="Model wearing the Static Velvet Mini" loading="lazy">
            <button class="wishlist-mark" type="button" data-product-id="static-velvet-mini" data-product-name="Static Velvet Mini" aria-label="Add Static Velvet Mini to wishlist" aria-pressed="false">
              <img class="wishlist-outline" src="images/main/wishlist-heart-outline.png" alt="">
              <svg class="wishlist-filled" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
            </button>
          </div>
          <img class="product-label" src="images/main/label-static-velvet-mini.png" alt="Static Velvet Mini, 92 dollars" loading="lazy">
        </article>
        <article class="product-card">
          <div class="product-image-wrap">
            <img class="product-image" src="images/main/BROKENSIGILPENDANT.png" alt="Broken Sigil Pendant necklace" loading="lazy">
            <button class="wishlist-mark" type="button" data-product-id="broken-sigil-pendant" data-product-name="Broken Sigil Pendant" aria-label="Add Broken Sigil Pendant to wishlist" aria-pressed="false">
              <img class="wishlist-outline" src="images/main/wishlist-heart-outline.png" alt="">
              <svg class="wishlist-filled" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78Z"/></svg>
            </button>
          </div>
          <div class="product-label-split" role="img" aria-label="Broken Sigil Pendant, 68 dollars">
            <span class="broken-label-name" aria-hidden="true"></span>
            <span class="broken-label-price" aria-hidden="true"></span>
          </div>
        </article>
      </div>
    </section>

    <section class="muse-section" id="the-muse" aria-label="The Muse">
      <picture class="muse-art">
        <source media="(prefers-reduced-motion: reduce)" srcset="images/main/the-muse-banner-no-frame.png">
        <img src="images/main/gif.gif" alt="Monochrome manga portrait of the Dream Witness muse" loading="lazy">
      </picture>
      <div class="muse-copy">
        <img class="muse-eyebrow" src="images/main/muse-text-01-eyebrow.png" alt="The Muse" loading="lazy">
        <img class="muse-title" src="images/main/muse-text-02-headline.png" alt="She lives between dreams" loading="lazy">
        <img class="muse-description" src="images/main/muse-text-description-final.png" alt="A quiet presence between sleep and waking. Her shadow lingers in every piece." loading="lazy">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a class="footer-brand" href="#top" aria-label="Dream Witness home">
        <img src="images/main/dream-witness-lockup-transparent.png" alt="Dream Witness" loading="lazy">
      </a>
      <div class="footer-links" role="group" aria-label="Footer navigation">
        <div class="footer-link-column footer-shop-links" role="img" aria-label="Shop: All products, new arrivals, tops, outerwear, bottoms, accessories">
          <span class="footer-link-heading footer-shop-heading" aria-hidden="true"></span>
          <div class="footer-link-items" aria-hidden="true">
            <span class="footer-link-item footer-shop-all"></span>
            <span class="footer-link-item footer-shop-new"></span>
            <span class="footer-link-item footer-shop-tops"></span>
            <span class="footer-link-item footer-shop-outerwear"></span>
            <span class="footer-link-item footer-shop-bottoms"></span>
            <span class="footer-link-item footer-shop-accessories"></span>
          </div>
        </div>
        <div class="footer-link-column footer-explore-links" role="img" aria-label="Explore: Our story, The Muse">
          <span class="footer-link-heading footer-explore-heading" aria-hidden="true"></span>
          <div class="footer-link-items" aria-hidden="true">
            <span class="footer-link-item footer-explore-story"></span>
            <span class="footer-link-item footer-explore-muse"></span>
          </div>
        </div>
        <div class="footer-link-column footer-support-links" role="img" aria-label="Support: FAQ, shipping and returns, contact">
          <span class="footer-support-heading" aria-hidden="true"></span>
          <div class="footer-support-items" aria-hidden="true">
            <span class="footer-support-item footer-support-faq"></span>
            <span class="footer-support-item footer-support-shipping"></span>
            <span class="footer-support-item footer-support-contact"></span>
          </div>
        </div>
      </div>
      <div class="footer-newsletter">
        <img class="newsletter-copy" src="images/main/newsletter-copy.png" alt="Join our newsletter. New arrivals and stories from Dream Witness." loading="lazy">
        <form class="newsletter-form" id="newsletter-form">
          <label class="visually-hidden" for="newsletter-email">Your email address</label>
          <input id="newsletter-email" name="email" type="email" autocomplete="email" placeholder="Your email address" required>
          <button type="submit" aria-label="Send newsletter sign-up request">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12h15M13 5l7 7-7 7" /></svg>
          </button>
        </form>
        <p class="newsletter-status" id="newsletter-status" role="status" aria-live="polite"></p>
        <div class="social-links" aria-label="Social channels">
          <span><img src="images/main/dream-witness-instagram-icon.png" alt="Instagram" loading="lazy"></span>
          <span><img src="images/main/dream-witness-tiktok-icon.png" alt="TikTok" loading="lazy"></span>
          <span><img src="images/main/dream-witness-youtube-icon.png" alt="YouTube" loading="lazy"></span>
        </div>
        <img class="copyright" src="images/main/copyright.png" alt="Copyright 2026 Dream Witness. All rights reserved." loading="lazy">
      </div>
    </div>
  </footer>
</body>
</html>
